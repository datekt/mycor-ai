<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MYCOR</title>
<style>
:root {
  --bg: #0e0e12;
  --panel: #17171f;
  --border: #2a2a36;
  --fg: #e8e8f0;
  --muted: #8b8b9a;
  --accent: #7c5cff;
  --accent2: #4fd1c5;
  --danger: #ff6b6b;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--fg);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
header {
  padding: 12px 20px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  font-weight: 600;
  letter-spacing: 0.5px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
header .tag { font-size: 12px; color: var(--muted); font-weight: 400; }
#app {
  flex: 1;
  display: grid;
  grid-template-columns: 320px 1fr;
  min-height: 0;
}
#sidebar {
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
}
.panel h3 {
  margin: 0 0 10px;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--muted);
}
.stat-row {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  padding: 3px 0;
}
.stat-row span:last-child { color: var(--accent2); font-variant-numeric: tabular-nums; }
.control { margin-bottom: 12px; }
.control label {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 4px;
}
.control label b { color: var(--fg); font-weight: 500; font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
button {
  font: inherit;
  background: var(--panel);
  color: var(--fg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 12px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: white; }
button.danger { color: var(--danger); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
#chat { display: flex; flex-direction: column; min-height: 0; }
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.msg {
  max-width: 780px;
  padding: 10px 14px;
  border-radius: 10px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-wrap: break-word;
}
.msg.user { align-self: flex-end; background: var(--accent); color: white; }
.msg.ai { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
.msg.thoughts {
  align-self: flex-start;
  font-style: italic;
  color: var(--muted);
  font-size: 13px;
  background: transparent;
  border: 1px dashed var(--border);
  padding: 6px 12px;
}
.msg.system { align-self: center; font-size: 12px; color: var(--muted); text-align: center; }
.msg .role {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  opacity: 0.7;
  margin-bottom: 4px;
}
#trainPanel {
  padding: 12px 24px;
  background: var(--panel);
  border-top: 1px solid var(--border);
  display: none;
  gap: 10px;
  align-items: center;
}
#trainPanel.visible { display: flex; }
#trainPanel input {
  flex: 1;
  background: var(--bg);
  color: var(--fg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 12px;
  font: inherit;
  outline: none;
}
#inputRow {
  padding: 16px 24px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 10px;
  background: var(--panel);
}
#inputRow input {
  flex: 1;
  background: var(--bg);
  color: var(--fg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px 14px;
  font: inherit;
  outline: none;
}
#inputRow input:focus { border-color: var(--accent); }
.hint { font-size: 12px; color: var(--muted); padding: 8px 0 0; word-break: break-all; }
.busy { opacity: 0.5; pointer-events: none; }
</style>
</head>
<body>
<header>
  <div>MYCOR AI <span class="tag" id="tagline"></span></div>
  <div>
    <button id="langBtn" style="padding:4px 10px;font-size:12px">EN / RU</button>
  </div>
</header>
<div id="app">
  <aside id="sidebar">
    <div class="panel">
      <h3 data-i18n="statistics">Statistics</h3>
      <div id="stats"></div>
    </div>
    <div class="panel">
      <h3 data-i18n="sampling">Sampling</h3>
      <div class="control">
        <label><span data-i18n="temperature">Temperature</span> <b id="tempVal">0.70</b></label>
        <input id="temp" type="range" min="0.1" max="1.5" step="0.05" value="0.7">
      </div>
      <div class="control">
        <label><span data-i18n="topK">Top-K</span> <b id="topkVal">40</b></label>
        <input id="topk" type="range" min="0" max="200" step="1" value="40">
      </div>
      <div class="control">
        <label><span data-i18n="topP">Top-P</span> <b id="toppVal">0.90</b></label>
        <input id="topp" type="range" min="0" max="1" step="0.01" value="0.9">
      </div>
    </div>
    <div class="panel">
      <h3 data-i18n="learning">Learning</h3>
      <div class="control">
        <label><span data-i18n="learningRate">Learning Rate</span> <b id="lrVal">0.50</b></label>
        <input id="lr" type="range" min="0.01" max="1.0" step="0.01" value="0.5">
      </div>
      <div class="control">
        <label><span data-i18n="momentum">Momentum</span> <b id="momVal">0.90</b></label>
        <input id="mom" type="range" min="0" max="0.99" step="0.01" value="0.9">
      </div>
      <div class="control">
        <label><span data-i18n="contextSize">Context Size</span> <b id="ctxVal">2</b></label>
        <input id="ctx" type="range" min="1" max="5" step="1" value="2">
      </div>
      <div class="control">
        <label><span data-i18n="thinkingSteps">Thinking Steps</span> <b id="thinkVal">4</b></label>
        <input id="think" type="range" min="1" max="16" step="1" value="4">
      </div>
    </div>
    <div class="panel">
      <h3 data-i18n="actions">Actions</h3>
      <div class="actions">
        <button id="undoBtn" data-i18n="undo">Undo</button>
        <button id="resetBtn" class="danger" data-i18n="reset">Reset</button>
        <button id="idleBtn" data-i18n="idle">Idle</button>
        <button id="importBtn" data-i18n="import">Import</button>
      </div>
      <div class="hint" id="brainPath"></div>
    </div>
  </aside>
  <main id="chat">
    <div id="messages"></div>
    <div id="trainPanel">
      <span style="color:var(--muted);font-size:13px" data-i18n="teachCorrection">Teach correction:</span>
      <input id="trainInput" data-i18n-placeholder="correctAnswerPlaceholder" placeholder="Type the correct answer, or leave empty to skip">
      <button id="trainSend" class="primary" data-i18n="train">Train</button>
      <button id="trainSkip" data-i18n="skip">Skip</button>
    </div>
    <div id="inputRow">
      <input id="input" data-i18n-placeholder="messagePlaceholder" placeholder="Type a message and press Enter..." autocomplete="off">
      <button id="send" class="primary" data-i18n="send">Send</button>
    </div>
  </main>
</div>
<script src="/app.js"></script>
</body>
</html>
